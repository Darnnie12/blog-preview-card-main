<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body{
      background-color: hsl(47, 88%, 63%);
      align-items: center;
      justify-content: center;
      display: flex;
      height: 100vh;
    }
    .wrap-all{
      
    }
    .first{
      border: 1px solid black;
      border-radius: 10px;
      box-shadow: 5px 5px 5px black;
      background-color: hsl(0, 0%, 100%);
      padding: 10px;
      margin: 10px;
      width: 30%;
      align-items: center;
      justify-content: center;
    }
    .first img{
      border-radius: 10px;
      width: 100%;
    }
    .first .third{
      border: 1px solid black;
      border-radius: 3px;
      width: 23%;
      text-align: center;
      padding: 4px;
      background-color: hsl(47, 88%, 63%);
      margin-bottom: 7px;
    }
    .first h2{
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .first p{
      padding: 7px;
    }
    .second{
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 30px;
    }
    .second img{
      width: 7%;
    }
    span{
      line-height: 1.4;
      opacity: 0.6;
    }
    @media screen and (max-width:1000px) {
      body{
        display: flex;
        width: 100%;
      }
      .first{
        font-size: small;
        width: 90%;
        padding: 10px;
      }
      h2{
      }
    }
  </style>
</head>
<body>
    <div class="first">
      <img src="assets/images/illustration-article.svg" alt="">
      <p class="third">Learning</p>
      <p>Published 21 Dec 2023</p>
      <h2>HTML & CSS foundations</h2>
      <span>These languages are the backbone of every website, defining structure, content, and presentation.</span>
      <div class="second">
        <img src="assets/images/image-avatar.webp" alt="">
        <p>Greg Hooper</p>
      </div>
    </div>
</body>
</html>
